<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trafik Kaçışı - Profesyonel Sürüm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap">
<style>
:root{ --lime:#c6ff3d; --cyan:#00e5ff; --amber:#ffb84d; --red:#ff3b4e; --bg:#05070a; }
*{margin:0;padding:0;box-sizing:border-box;}
body{ background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:"Rajdhani",sans-serif; overflow:hidden; user-select:none; touch-action:none; }
html,body{overscroll-behavior:none;}
#arena{ position:relative; width:100%; max-width:420px; aspect-ratio:420/760; margin:0 auto; touch-action:none; }
canvas{ display:block; width:100%; height:100%; border-radius:14px; box-shadow:0 0 0 2px rgba(198,255,61,0.15), 0 0 60px rgba(0,229,255,0.08), 0 20px 70px rgba(0,0,0,0.8); background:#0a0e14; }
#hud{ position:absolute; inset:0; pointer-events:none; border-radius:14px; overflow:hidden; }

.hud-tl, .hud-tc { position:absolute; top:16px; font-family:"Orbitron",monospace; color:#fff; }
.hud-tl{ left:18px; } .hud-tc{ width:100%; text-align:center; top:16px; }
.hud-tr-rekor { position:absolute; top: 60px; right: 18px; text-align:right; font-family:"Orbitron",monospace; color:#fff; }

.top-btn { position: absolute; top: 16px; width: 36px; height: 36px; background: rgba(5,7,10,0.6); border: 1px solid rgba(0,229,255,0.4); color: #fff; border-radius: 8px; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; transition: transform 0.1s; }
.top-btn:active { transform: scale(0.9); }
#btn-pause { right: 62px; } #btn-mute { right: 18px; }

.hud-label{ font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.55); }
.hud-val{ font-size:20px; font-weight:900; color:var(--lime); text-shadow:0 0 12px rgba(198,255,61,0.6); }
.hud-val.best{ color:var(--amber); text-shadow:0 0 12px rgba(255,184,77,0.5); font-size:14px; }
.hud-val.speed{ color:var(--cyan); text-shadow:0 0 12px rgba(0,229,255,0.6); font-size:22px; }
.hud-val.speed span { font-size:11px; color:rgba(255,255,255,0.7); text-shadow:none; }

#nitro-wrap{ position:absolute; left:14px; top:120px; width:120px; pointer-events:none; }
#nitro-label{ font-family:"Orbitron",monospace; font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.5); margin-bottom:4px; }
#nitro-bar{ width:100%; height:8px; background:rgba(255,255,255,0.12); border-radius:4px; overflow:hidden; border:1px solid rgba(255,255,255,0.2); }
#nitro-fill{ height:100%; width:100%; background:linear-gradient(90deg,#00e5ff,#c6ff3d); border-radius:4px; transition:width .05s linear; }

#combo-wrap{ position:absolute; left:14px; top:150px; transition:opacity 0.1s; opacity:0; }
#combo-val{ font-family:"Orbitron",monospace; font-weight:900; font-size:24px; color:var(--amber); text-shadow:0 0 15px var(--amber); }

/* KONTROLLER */
.control-btn { position:absolute; bottom:16px; width:55px; height:55px; border-radius:50%; font-family:"Orbitron",monospace; font-weight:900; font-size:10px; display:flex; align-items:center; justify-content:center; pointer-events:auto; letter-spacing:1px; transition: transform 0.1s; z-index: 10; color:#fff; border:2px solid; user-select:none; }
.control-btn:active, .control-btn.active { transform:scale(0.9); }
#btn-left { left: 10px; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.2), rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.4); }
#btn-right { left: 72px; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.2), rgba(255,255,255,0.05)); border-color:rgba(255,255,255,0.4); }
#btn-horn { left: 134px; background:radial-gradient(circle at 35% 30%, rgba(255,184,77,0.5), rgba(180,100,0,0.25)); border-color:var(--amber); box-shadow:0 0 20px rgba(255,184,77,0.3); }

#btn-brake { right: 88px; background:radial-gradient(circle at 35% 30%, rgba(255,59,78,0.5), rgba(180,0,0,0.25)); border-color:var(--red); box-shadow:0 0 25px rgba(255,59,78,0.35); }
#btn-brake.active { background:radial-gradient(circle at 35% 30%, rgba(255,59,78,0.8), rgba(180,0,0,0.5)); }
#btn-gas { right: 10px; width: 70px; height: 70px; bottom: 8px; background:radial-gradient(circle at 35% 30%, rgba(198,255,61,0.5), rgba(100,180,0,0.25)); border-color:var(--lime); box-shadow:0 0 25px rgba(198,255,61,0.35); font-size:12px; }
#btn-gas.active { background:radial-gradient(circle at 35% 30%, rgba(198,255,61,0.8), rgba(100,180,0,0.5)); }
#btn-nos { right: 15px; bottom: 90px; width: 50px; height: 50px; background:radial-gradient(circle at 35% 30%, rgba(0,229,255,0.5), rgba(0,150,180,0.25)); border-color:var(--cyan); box-shadow:0 0 20px rgba(0,229,255,0.35); }
#btn-nos.active { background:radial-gradient(circle at 35% 30%, rgba(0,229,255,0.8), rgba(0,150,180,0.5)); }

/* EKRANLAR */
.screen{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .35s ease; background:rgba(5,7,10,0.85); backdrop-filter:blur(8px); border-radius:14px; z-index: 20; }
.screen.on{ opacity:1; pointer-events:all; }
.panel{ text-align:center; padding:20px; width: 90%; }
.logo{ font-family:"Orbitron",monospace; font-weight:900; font-size:clamp(30px,8vw,42px); line-height:1; color:#fff; }
.logo span{ display:block; color:var(--lime); text-shadow:0 0 24px rgba(198,255,61,0.6); }
.tagline{ font-family:"Rajdhani",sans-serif; font-weight:300; font-size:12px; letter-spacing:6px; color:var(--cyan); margin-top:8px; margin-bottom:15px; }
.best-row{ font-family:"Orbitron",monospace; font-size:12px; color:rgba(255,255,255,0.6); margin-bottom:22px; letter-spacing:1px; line-height: 1.8; }
.best-row b{ color:var(--amber); }

.mod-selector { display:flex; justify-content:center; gap:10px; margin-bottom:20px; }
.mod-btn { padding:8px 15px; background:transparent; border:1px solid rgba(255,255,255,0.3); color:#fff; font-family:"Rajdhani"; font-weight:700; border-radius:6px; cursor:pointer; transition:0.2s; }
.mod-btn.active { background:var(--cyan); color:#000; border-color:var(--cyan); box-shadow:0 0 15px rgba(0,229,255,0.5); }

button.game-btn{ padding:14px 30px; margin: 5px; background:transparent; border:2px solid var(--lime); color:var(--lime); font-family:"Orbitron",monospace; font-weight:700; font-size:13px; letter-spacing:3px; cursor:pointer; clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%); transition:background .2s,box-shadow .2s,color .2s; width: 80%; }
button.game-btn:active{ background:var(--lime); color:#000; box-shadow:0 0 30px rgba(198,255,61,0.5); }
.btn-blue { border-color:var(--cyan); color:var(--cyan); } .btn-blue:active{ background:var(--cyan); color:#000; box-shadow:0 0 30px rgba(0,229,255,0.5); }

.crash-title{ color:var(--red); font-size:1.5em; text-shadow:0 0 18px rgba(255,59,78,0.7); font-family:"Orbitron",monospace; font-weight:900; margin-bottom:6px; }
.crash-score{ font-family:"Orbitron",monospace; font-size:30px; color:#fff; margin:10px 0 4px; }
.crash-new-best{ font-family:"Rajdhani",sans-serif; color:var(--amber); font-size:13px; letter-spacing:2px; margin-bottom:10px; display:none; }
.crash-sub{ font-family:"Rajdhani",sans-serif; color:rgba(255,255,255,0.5); font-size:12px; margin-bottom:8px; letter-spacing:1px; }

</style>
</head>
<body>
<div id="arena">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hud-tl"><div class="hud-label">MESAFE</div><div class="hud-val" id="hud-score">0m</div></div>
    <div class="hud-tc"><div class="hud-label">HIZ</div><div class="hud-val speed" id="hud-speed">0 <span>km/h</span></div></div>
    <div class="hud-tr-rekor"><div class="hud-label">REKOR</div><div class="hud-val best" id="hud-best">0m</div></div>
    <div id="btn-pause" class="top-btn">⏸</div><div id="btn-mute" class="top-btn">🔊</div>
    <div id="nitro-wrap"><div id="nitro-label">NOS</div><div id="nitro-bar"><div id="nitro-fill"></div></div></div>
    <div id="combo-wrap"><div class="hud-label" style="color:var(--amber);">KOMBO</div><div id="combo-val">x1</div></div>
  </div>
  
  <div id="btn-left" class="control-btn">◀</div>
  <div id="btn-right" class="control-btn">▶</div>
  <div id="btn-horn" class="control-btn">KORNA</div>
  <div id="btn-brake" class="control-btn">FREN</div>
  <div id="btn-nos" class="control-btn">NOS</div>
  <div id="btn-gas" class="control-btn">GAZ</div>

  <!-- ANA EKRAN -->
  <div id="start-screen" class="screen on">
    <div class="panel">
      <div class="logo">TRAFİK<span>KAÇIŞI</span></div>
      <div class="tagline">PROFESYONEL SÜRÜM</div>
      <div class="mod-selector">
        <button class="mod-btn" id="mod-oneway">TEK YÖN</button>
        <button class="mod-btn active" id="mod-twoway">ÇİFT YÖN</button>
      </div>
      <div class="best-row">REKOR: <b id="start-best">0m</b></div>
      <button class="game-btn" id="btn-start">YARIŞA BAŞLA</button>
    </div>
  </div>

  <!-- OYUN SONU -->
  <div id="gameover-screen" class="screen">
    <div class="panel">
      <div class="crash-title">ÇARPTIN!</div>
      <div class="crash-score" id="go-score">0m</div>
      <div class="crash-new-best" id="go-newbest">✨ YENİ REKOR! ✨</div>
      <div class="crash-sub">REKOR: <b id="go-best">0m</b></div>
      <button class="game-btn" id="btn-retry">TEKRAR DENE</button>
      <button class="game-btn btn-blue" id="btn-menu">ANA MENÜ</button>
    </div>
  </div>
</div>

<script>
const CV = document.getElementById('c'), G = CV.getContext('2d'), W = 420, H = 760;
CV.width = W; CV.height = H;

let best = parseInt(localStorage.getItem('trafikKacisiBest') || '0', 10);
if(document.getElementById('start-best')) document.getElementById('start-best').textContent = best + 'm'; 

let isTwoWay = true; // Oyun Modu Değişkeni
document.getElementById('mod-oneway').onclick = (e) => { isTwoWay = false; e.target.classList.add('active'); document.getElementById('mod-twoway').classList.remove('active'); };
document.getElementById('mod-twoway').onclick = (e) => { isTwoWay = true; e.target.classList.add('active'); document.getElementById('mod-oneway').classList.remove('active'); };

document.getElementById('btn-start').onclick = (e)=>{ e.preventDefault(); startGame(); };
document.getElementById('btn-retry').onclick = (e)=>{ e.preventDefault(); startGame(); };
document.getElementById('btn-menu').onclick = (e)=>{ e.preventDefault(); document.getElementById('gameover-screen').classList.remove('on'); document.getElementById('start-screen').classList.add('on'); state='title'; };

/* ============== SES MOTORU (3 KADEMELİ) ============== */
let audioCtx = null, engineOsc = null, engineOsc2 = null, engineGain = null, nitroNoise = null, nitroGain = null;
let volState = 2; // 2: Yüksek, 1: Kısık, 0: Kapalı
let isPaused = false;

document.getElementById('btn-mute').onclick = (e)=>{
  e.preventDefault(); e.target.blur();
  volState = (volState === 2) ? 1 : (volState === 1 ? 0 : 2);
  const icons = ['🔇', '🔉', '🔊']; e.target.innerText = icons[volState];
  if(engineGain) engineGain.gain.value = volState === 2 ? 0.05 : (volState === 1 ? 0.015 : 0);
  if(volState === 0) { if(engineOsc) engineOsc.stop(); if(engineOsc2) engineOsc2.stop(); engineOsc=null; engineOsc2=null; } 
  else if (state === 'play' && !isPaused && !engineOsc) startEngine();
};

document.getElementById('btn-pause').onclick = (e)=>{
  e.preventDefault(); e.target.blur(); if (state !== 'play') return;
  isPaused = !isPaused; document.getElementById('btn-pause').innerText = isPaused ? '▶' : '⏸';
  if (isPaused) { if(engineOsc) stopEngine(); G.fillStyle = 'rgba(0,0,0,0.6)'; G.fillRect(0,0,W,H); G.fillStyle = '#fff'; G.font = 'bold 30px Orbitron'; G.textAlign = 'center'; G.fillText('DURAKLATILDI', W/2, H/2); } 
  else { if(volState > 0) startEngine(); }
};

function getAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function startEngine(){
  if(volState === 0) return; getAudio();
  if(engineOsc) { engineOsc.stop(); if(engineOsc2) engineOsc2.stop(); }
  engineGain = audioCtx.createGain(); engineGain.gain.value = volState === 2 ? 0.05 : 0.015;
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 600;
  
  engineOsc = audioCtx.createOscillator(); engineOsc.type = 'sawtooth';
  engineOsc2 = audioCtx.createOscillator(); engineOsc2.type = 'sine'; // Alt frekans (Tokluk)
  
  engineOsc.connect(filter); engineOsc2.connect(filter);
  filter.connect(engineGain); engineGain.connect(audioCtx.destination);
  engineOsc.start(); engineOsc2.start();
}
function stopEngine(){ if(engineGain) engineGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); setTimeout(() => { if(engineOsc){ engineOsc.stop(); engineOsc2.stop(); engineOsc=null; engineOsc2=null;} }, 250); }

function mkNoise(ctx, dur){ const b = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate); const d = b.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1; const s = ctx.createBufferSource(); s.buffer = b; return s; }
function sfx(type){
  if(!audioCtx || volState === 0) return; const ctx = audioCtx, t = ctx.currentTime, out = ctx.destination;
  let vMult = volState === 2 ? 1 : 0.4;
  if(type === 'nitro_on' && !nitroNoise){ 
    nitroNoise = mkNoise(ctx, 10); nitroNoise.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 2000;
    nitroGain = ctx.createGain(); nitroGain.gain.setValueAtTime(0, t); nitroGain.gain.linearRampToValueAtTime(0.5 * vMult, t+0.2);
    nitroNoise.connect(hp).connect(nitroGain).connect(out); nitroNoise.start(t);
  }
  if(type === 'nitro_off' && nitroNoise){ nitroGain.gain.linearRampToValueAtTime(0.01, t+0.2); setTimeout(()=>{if(nitroNoise)nitroNoise.stop(); nitroNoise=null;}, 200); }
  if(type === 'horn'){
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o1.type = 'square'; o1.frequency.value = 350; o2.type = 'square'; o2.frequency.value = 400;
    g.gain.setValueAtTime(0.15 * vMult, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.3);
    o1.connect(g); o2.connect(g); g.connect(out); o1.start(t); o2.start(t); o1.stop(t+0.35); o2.stop(t+0.35);
  }
  if(type === 'brake'){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(1200, t); o.frequency.exponentialRampToValueAtTime(800, t+0.3);
    g.gain.setValueAtTime(0.08 * vMult, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.3); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.3);
  }
  if(type === 'nearmiss'){ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(1200, t+0.12); g.gain.setValueAtTime(0.18 * vMult, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.15); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.16); }
  if(type === 'pickup'){ [660,880,1100].forEach((f,i)=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(0.14 * vMult, t+i*0.05); g.gain.exponentialRampToValueAtTime(0.001, t+i*0.05+0.1); o.connect(g); g.connect(out); o.start(t+i*0.05); o.stop(t+i*0.05+0.1); }); }
  if(type === 'crash'){ const n = mkNoise(ctx, 0.45); const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(2200,t); lp.frequency.exponentialRampToValueAtTime(120,t+0.45); const g = ctx.createGain(); g.gain.setValueAtTime(0.65 * vMult,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.45); n.connect(lp); lp.connect(g); g.connect(out); n.start(t); n.stop(t+0.45); const o = ctx.createOscillator(), g2 = ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(30,t+0.4); g2.gain.setValueAtTime(0.45 * vMult,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.connect(g2); g2.connect(out); o.start(t); o.stop(t+0.41); }
}

/* ============== YOL VE OYUN FİZİĞİ ============== */
const ROAD_X = 50, ROAD_W = 320, LANE_W = ROAD_W / 4;
const LANE_X = [ROAD_X + LANE_W*0.5, ROAD_X + LANE_W*1.5, ROAD_X + LANE_W*2.5, ROAD_X + LANE_W*3.5];

let state = 'title', tick = 0, score = 0, combo = 1, comboTimer = 0; 
let shakeAmt = 0, shakeX = 0, shakeY = 0, roadDashOffset = 0, bgOffset = 0;
let currentSpeed = 0, weather = 'clear'; 
const COAST_SPEED = 1.5, GAS_SPEED = 9.5, NOS_SPEED = 15.0, STEER_SPEED = 7.0, BRAKE_SPEED = 0.5, ACCEL = 0.12, DECEL = 0.025, BRAKE_DECEL = 0.40;  

let gasHeld = false, brakeHeld = false, nosHeld = false, leftHeld = false, rightHeld = false, wasNosHeld = false; 
let nitroFuel = 100;
const player = { x: LANE_X[2], y: H - 150, w: 30, h: 54, targetX: LANE_X[2], color: '#00e5ff', lane: 2 };
const traffic = [], pickups = [], particles = [], popups = [], skids = [], envParticles = []; 
let spawnTimer = 40, pickupTimer = 220, wrongWayTimer = 0; 

function burst(x,y,col1,col2,n){ for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = 1.5+Math.random()*6; particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1, life:1, col: Math.random()>0.5?col1:col2, size:2+Math.random()*4, gravity:0.15+Math.random()*0.1 }); } }
function updateParticles(){ for(let i=particles.length-1;i>=0;i--){ const p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity; p.vx*=0.97; p.life-=0.03; if(p.life<=0) particles.splice(i,1); } }
function drawParticles(){ particles.forEach(p=>{ G.save(); G.globalAlpha=Math.max(0,p.life); G.fillStyle=p.col; G.beginPath(); G.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); G.fill(); G.restore(); }); }

function popup(x,y,text,col){ popups.push({x,y,life:1,text,col}); }
function updatePopups(){ for(let i=popups.length-1;i>=0;i--){ popups[i].life-=0.018; popups[i].y-=0.8; if(popups[i].life<=0) popups.splice(i,1); } }
function drawPopups(){ popups.forEach(p=>{ G.save(); G.globalAlpha=Math.max(0,p.life); G.font='bold 14px Orbitron, monospace'; G.fillStyle=p.col; G.textAlign='center'; G.fillText(p.text, p.x, p.y); G.restore(); }); }

function shake(amt){ shakeAmt = Math.max(shakeAmt, amt); }

/* GİRİŞ KONTROLLERİ */
function bindBtn(el, d, u) { el.onpointerdown = (e)=>{e.preventDefault(); d(); el.classList.add('active'); getAudio();}; el.onpointerup = (e)=>{e.preventDefault(); u(); el.classList.remove('active');}; el.onpointerleave = (e)=>{u(); el.classList.remove('active');}; el.onpointercancel = (e)=>{u(); el.classList.remove('active');}; }
bindBtn(document.getElementById('btn-gas'), ()=>gasHeld=true, ()=>gasHeld=false); bindBtn(document.getElementById('btn-brake'), ()=>brakeHeld=true, ()=>brakeHeld=false); bindBtn(document.getElementById('btn-nos'), ()=>nosHeld=true, ()=>nosHeld=false); bindBtn(document.getElementById('btn-left'), ()=>leftHeld=true, ()=>leftHeld=false); bindBtn(document.getElementById('btn-right'), ()=>rightHeld=true, ()=>rightHeld=false);
bindBtn(document.getElementById('btn-horn'), ()=>{ if(state==='play'){ sfx('horn'); triggerHorn(); } }, ()=>{});

window.addEventListener('keydown', (e)=>{ 
  if(e.code==='ArrowLeft'||e.code==='KeyA') leftHeld=true; if(e.code==='ArrowRight'||e.code==='KeyD') rightHeld=true; if(e.code==='ArrowUp'||e.code==='KeyW') gasHeld=true; if(e.code==='ArrowDown'||e.code==='KeyS') brakeHeld=true; if(e.code==='Space') nosHeld=true; 
  if(e.code==='KeyK') { if(state==='play'){ sfx('horn'); triggerHorn(); } }
});
window.addEventListener('keyup', (e)=>{ if(e.code==='ArrowLeft'||e.code==='KeyA') leftHeld=false; if(e.code==='ArrowRight'||e.code==='KeyD') rightHeld=false; if(e.code==='ArrowUp'||e.code==='KeyW') gasHeld=false; if(e.code==='ArrowDown'||e.code==='KeyS') brakeHeld=false; if(e.code==='Space') nosHeld=false; });

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* DİNAMİK ZAMAN VE HAVA DURUMU */
function getNightFactor() { 
  let phase = (score % 30000) / 30000; 
  if (phase < 0.4) return 0; // Gündüz
  if (phase < 0.6) return (phase - 0.4) * 5; // Gün Batımı
  if (phase < 0.9) return 1; // Gece
  return Math.max(0, 1 - ((phase - 0.9) * 10)); // Gün Doğumu
}
function updateWeatherState() {
  let wPhase = (score % 40000) / 40000;
  if(wPhase < 0.4) weather = 'clear'; else if(wPhase < 0.7) weather = 'rain'; else weather = 'snow';
}

function roundRectPath(ctx, x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* FPS SABİTLEYİCİ */
let lastTime = 0; const FPS_LIMIT = 60, frameInterval = 1000 / FPS_LIMIT;

function startGame(){
  getAudio(); startEngine();
  state = 'play'; score = 0; tick = 0; currentSpeed = 0; weather = 'clear';
  traffic.length = 0; pickups.length = 0; particles.length = 0; popups.length = 0; skids.length = 0; envParticles.length = 0;
  nitroFuel = 100; gasHeld = brakeHeld = nosHeld = leftHeld = rightHeld = wasNosHeld = false; combo = 1; comboTimer = 0;
  player.x = LANE_X[2]; player.targetX = LANE_X[2]; player.lane = 2;
  spawnTimer = 20; pickupTimer = 220; wrongWayTimer = 0; shakeAmt = 0; isPaused = false; 
  document.getElementById('btn-pause').innerText = '⏸'; document.querySelectorAll('.control-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('start-screen').classList.remove('on'); document.getElementById('gameover-screen').classList.remove('on');
  updateHud(); lastTime = performance.now();
}

function crash(){
  if(state !== 'play') return; state = 'crash'; stopEngine(); sfx('crash'); if(nitroNoise) sfx('nitro_off'); shake(14);
  burst(player.x, player.y, '#ff3b4e', '#ffb84d', 46);
  if (Math.round(score) > best) { best = Math.round(score); try { localStorage.setItem('trafikKacisiBest', String(best)); } catch(e){} document.getElementById('go-newbest').style.display = 'block'; } else { document.getElementById('go-newbest').style.display = 'none'; }
  setTimeout(()=>{ document.getElementById('go-score').textContent = Math.round(score) + 'm'; document.getElementById('go-best').textContent = best + 'm'; document.getElementById('gameover-screen').classList.add('on'); }, 650);
}

function updateHud(){
  document.getElementById('hud-score').textContent = Math.round(score) + 'm'; document.getElementById('hud-best').textContent = best + 'm';
  if(document.getElementById('start-best')) document.getElementById('start-best').textContent = best + 'm'; 
  document.getElementById('nitro-fill').style.width = nitroFuel + '%'; document.getElementById('btn-nos').style.opacity = nitroFuel > 2 ? '1' : '0.4';
  document.getElementById('hud-speed').innerHTML = Math.round(currentSpeed * 14.5) + ' <span>km/h</span>';
  let cw = document.getElementById('combo-wrap'); cw.style.opacity = combo > 1 ? (comboTimer < 60 ? (Math.floor(tick / 10) % 2 === 0 ? '1' : '0.3') : '1') : '0'; document.getElementById('combo-val').textContent = 'x' + combo;
}

const CAR_COLORS = ['#e0463c','#3fa9f5','#f5c542','#8e6bd8','#4caf6a','#f57f42', '#ffffff', '#222222'];
function spawnTraffic(){
  const lane = Math.floor(Math.random()*4); const laneX = LANE_X[lane];
  const isTruck = Math.random() < 0.15; const w = isTruck ? 36 : 30, h = isTruck ? 100 : 54; 
  const oncoming = isTwoWay ? (lane < 2) : false; 
  let ownSpeed = oncoming ? -(2.0 + Math.random()*2.5) : (isTruck ? 1.0 + Math.random() : 1.5 + Math.random()*3.5);
  let spawnY = oncoming ? -200 : (ownSpeed > currentSpeed + 0.5 ? H + 200 : -200);
  if (traffic.some(c => c.lane === lane && Math.abs(c.y - spawnY) < 260)) return;

  traffic.push({ x: laneX, y: spawnY, w, h, lane, ownSpeed, color: CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)], oncoming, passed: false, nearMissAwarded: false, isTruck, isCrazy: !isTruck && Math.random() < Math.min(0.15 + (score / 15000), 0.60), aiState: 'wait', aiTimer: 60 + Math.random() * 100, turnSignal: 0, targetLaneX: laneX, targetLane: lane });
}
function spawnPickup(){ pickups.push({ x: LANE_X[Math.floor(Math.random()*4)], y: -60, r: 12, collected: false }); }

function triggerHorn() {
  traffic.forEach(c => {
    if (!c.oncoming && c.lane === player.lane && c.y < player.y && player.y - c.y < 300) {
      let opts = [];
      if (c.lane > 2 && isTwoWay) opts.push(3); else if (!isTwoWay && c.lane > 0) opts.push(c.lane - 1);
      if (c.lane < 3) opts.push(c.lane + 1);
      for(let l of opts) { if (!traffic.some(o => o !== c && o.lane === l && Math.abs(o.y - c.y) < 200)) { c.aiState = 'signaling'; c.aiTimer = 15; c.targetLane = l; c.targetLaneX = LANE_X[l]; c.turnSignal = l > c.lane ? 1 : -1; break; } }
    }
  });
}

function updatePhysics() {
  let targetSpeed = COAST_SPEED;
  if (nosHeld && nitroFuel > 0) { if (!wasNosHeld) { sfx('nitro_on'); wasNosHeld = true; } targetSpeed = NOS_SPEED; nitroFuel -= NITRO_DRAIN; } 
  else { if (wasNosHeld) { sfx('nitro_off'); wasNosHeld = false; } nitroFuel = Math.min(100, nitroFuel + NITRO_AUTO_REGEN); if (gasHeld) targetSpeed = GAS_SPEED; }
  
  if (brakeHeld) { 
    targetSpeed = BRAKE_SPEED; 
    if(currentSpeed > 5) { if(tick%5===0) sfx('brake'); skids.push({x:player.x-10, y:player.y+20, life:1}); skids.push({x:player.x+10, y:player.y+20, life:1}); } 
  }

  if (currentSpeed < targetSpeed) currentSpeed += ACCEL; else if (currentSpeed > targetSpeed) currentSpeed -= brakeHeld ? BRAKE_DECEL : DECEL;
  
  if(engineOsc && audioCtx){ 
    let pitch = 35 + (currentSpeed * 6); 
    if(nosHeld && nitroFuel > 0) pitch += 30; 
    engineOsc.frequency.setValueAtTime(pitch, audioCtx.currentTime); 
    if(engineOsc2) engineOsc2.frequency.setValueAtTime(pitch * 0.5, audioCtx.currentTime); // Ses Hatası (Cızırtı) Çözüldü
  }
}

function updatePlayer(){
  updateWeatherState();
  let grip = 1.0; if(weather === 'rain') grip = 0.7; if(weather === 'snow') grip = 0.4;

  if (keys.left || leftHeld) player.targetX -= STEER_SPEED;
  if (keys.right || rightHeld) player.targetX += STEER_SPEED;
  player.targetX = clamp(player.targetX, ROAD_X+24, ROAD_X+ROAD_W-24);
  
  let handling = STEER_SPEED * 0.035 * grip; 
  player.x += (player.targetX - player.x) * handling;
  player.lane = Math.floor((player.x - ROAD_X) / LANE_W);

  const isWrongWay = isTwoWay && player.x < (ROAD_X + ROAD_W/2);
  if (isWrongWay && currentSpeed > 4) { wrongWayTimer++; if (wrongWayTimer > 45) { comboTimer = 300; let pts = 50 * combo; score += pts; popup(player.x, player.y - 40, '+' + pts + ' TERS YÖN x' + combo, '#ff3b4e'); wrongWayTimer = 0; combo++; } } else { wrongWayTimer = 0; }
}

function updateTraffic(){
  for (let i = traffic.length - 1; i >= 0; i--) {
    const c = traffic[i];
    if (c.isCrazy && c.aiState === 'wait') {
      c.aiTimer--;
      if (c.aiTimer <= 0) {
        if (Math.random() < 0.3) { c.aiState = 'braking'; c.ownSpeed = c.oncoming ? -1.5 : 1.5; } 
        else {
          let opts = [];
          if (c.oncoming) { if (c.lane === 1) opts.push(0); if (c.lane === 0) opts.push(1); } else { if (c.lane === 2 && isTwoWay) opts.push(3); else if (!isTwoWay && c.lane > 0) opts.push(c.lane-1); if (c.lane < 3) opts.push(c.lane+1); }
          if (opts.length > 0) { let nl = opts[0]; if (!traffic.some(o => o !== c && o.lane === nl && Math.abs(o.y - c.y) < 180)) { c.aiState = 'signaling'; c.aiTimer = 45; c.targetLane = nl; c.targetLaneX = LANE_X[newLane]; c.turnSignal = nl > c.lane ? 1 : -1; } else { c.aiState = 'braking'; c.ownSpeed = c.oncoming ? -1.0 : 1.0; } }
        }
      }
    } else if (c.aiState === 'signaling') { c.aiTimer--; if (c.aiTimer <= 0) { c.aiState = 'changing'; c.lane = c.targetLane; }
    } else if (c.aiState === 'changing') { c.x += (c.targetLaneX - c.x) * 0.05; if (Math.abs(c.x - c.targetLaneX) < 2) { c.x = c.targetLaneX; c.aiState = 'wait'; c.turnSignal = 0; c.aiTimer=120; } }

    for (let j = 0; j < traffic.length; j++) {
      if (i === j) continue; const o = traffic[j];
      if (c.lane === o.lane && c.aiState !== 'changing' && o.aiState !== 'changing' && c.oncoming === o.oncoming) {
        if (!c.oncoming && c.y > o.y && c.y - o.y < (c.h/2 + o.h/2 + 25)) { c.ownSpeed = Math.min(c.ownSpeed, o.ownSpeed); c.y = o.y + (c.h/2 + o.h/2 + 25); } 
        else if (c.oncoming && c.y < o.y && o.y - c.y < (c.h/2 + o.h/2 + 25)) { c.ownSpeed = Math.max(c.ownSpeed, o.ownSpeed); c.y = o.y - (c.h/2 + o.h/2 + 25); }
      }
    }

    if (!c.oncoming && Math.abs(c.x - player.x) <= LANE_W * 0.8) { if (c.y > player.y && c.y - player.y < 120) { if (c.ownSpeed > currentSpeed) { c.ownSpeed = currentSpeed; c.aiState = 'braking'; } } }

    c.y += (currentSpeed - c.ownSpeed); 
    if (Math.abs(c.x - player.x) < (c.w+player.w)/2 - 2 && Math.abs(c.y - player.y) < (c.h+player.h)/2 - 5) crash();

    if (!c.passed && c.y > player.y + 40) { c.passed = true; if (!c.oncoming && Math.abs(c.x - player.x) <= LANE_W * 1.5) { comboTimer = 300; let pts = 15 * combo; score += pts; popup(c.x, player.y-30, '+' + pts + ' SOLLAMA x' + combo, '#c6ff3d'); combo++; } }
    if (!c.nearMissAwarded && Math.abs(c.y - player.y) < 35 && currentSpeed > 4) { const g = Math.abs(c.x - player.x) - (c.w+player.w)/2; if (g > 0 && g < 18) { c.nearMissAwarded = true; comboTimer = 300; let pts = 40 * combo; score += pts; popup(player.x, player.y-50, '+' + pts + ' MAKAS! x' + combo, '#00e5ff'); sfx('nearmiss'); combo++; } }
    if (c.y > H + 300 || c.y < -400) traffic.splice(i,1);
  }
}

function updatePickups(){
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i]; p.y += currentSpeed;
    if (!p.collected && Math.abs(p.x-player.x) < 28 && Math.abs(p.y-player.y) < 38) { p.collected = true; score += 30; nitroFuel = Math.min(100, nitroFuel + 40); popup(p.x, p.y-20, '+NOS', '#ffb84d'); sfx('pickup'); }
    if (p.collected || p.y > H+60) pickups.splice(i,1);
  }
}

function drawBackground(){
  let night = state === 'title' ? 0 : getNightFactor(); 
  const g = G.createLinearGradient(0,0,0,H);
  if(weather==='snow') { g.addColorStop(0, `rgb(${Math.round(150-100*night)},${Math.round(180-120*night)},${Math.round(200-150*night)})`); g.addColorStop(1, '#05070a'); } 
  else if(weather==='rain') { g.addColorStop(0, `rgb(${Math.round(50-40*night)},${Math.round(60-50*night)},${Math.round(80-70*night)})`); g.addColorStop(1, '#05070a'); } 
  else { g.addColorStop(0, `rgb(${Math.round(77 - 71*night)},${Math.round(166 - 150*night)},${Math.round(255 - 223*night)})`); g.addColorStop(1, '#05070a'); }
  G.fillStyle = g; G.fillRect(0,0,W,H);

  if (night > 0.1 && weather === 'clear') { G.save(); G.fillStyle = '#fff'; bgStars.forEach(s => { G.globalAlpha = (Math.sin(tick*0.05 + s.a*10) * 0.5 + 0.5) * night; G.beginPath(); G.arc(s.x, s.y, s.s, 0, Math.PI*2); G.fill(); s.y += currentSpeed * 0.01; if(s.y > H) { s.y = 0; s.x = Math.random()*W; } }); G.restore(); }

  bgOffset += currentSpeed * 0.25; G.save(); G.globalAlpha = 0.5 - (night * 0.2);
  for (let i=0;i<9;i++){ const hx = (i*130 - (bgOffset % 130)); G.fillStyle = (weather==='snow')?(i%2===0?'#b0bec5':'#90a4ae'):(i%2===0 ? '#141f38' : '#101a30'); G.beginPath(); G.moveTo(hx, 160); G.lineTo(hx+65, 120); G.lineTo(hx+130, 160); G.closePath(); G.fill(); } G.restore();

  G.fillStyle = (weather==='snow')?`rgb(${Math.round(200-150*night)},${Math.round(220-170*night)},${Math.round(230-180*night)})`:`rgb(${Math.round(42 - 42*night)},${Math.round(77 - 77*night)},${Math.round(46 - 46*night)})`;
  G.fillRect(0, 0, ROAD_X, H); G.fillRect(ROAD_X+ROAD_W, 0, W-(ROAD_X+ROAD_W), H);
}

function drawRoad(){
  G.fillStyle = weather==='snow'?'#3a404d':'#262933'; G.fillRect(ROAD_X, 0, ROAD_W, H);
  roadDashOffset += currentSpeed; const stripeH = 26;
  [ROAD_X-8, ROAD_X+ROAD_W-4].forEach((sx)=>{ for (let y = -stripeH + (roadDashOffset % (stripeH*2)); y < H; y += stripeH*2) { G.fillStyle = weather==='snow'?'#fff':'#ddd'; G.fillRect(sx, y, 8, stripeH); G.fillStyle = '#c0392b'; G.fillRect(sx, y+stripeH, 8, stripeH); } });
  
  // FREN İZİ (Skid Marks) Çizimi
  G.fillStyle = 'rgba(10,10,10,0.5)';
  for(let i=skids.length-1; i>=0; i--){ let s=skids[i]; s.y+=currentSpeed; s.life-=0.015; if(s.life<=0) skids.splice(i,1); else { G.globalAlpha=s.life; G.beginPath(); G.arc(s.x, s.y, 3, 0, Math.PI*2); G.fill(); } } G.globalAlpha=1;

  const dashLen = 35, gapLen = 25;
  let divX1 = ROAD_X + LANE_W; G.strokeStyle = 'rgba(255,255,255,0.7)'; G.lineWidth = 3; for (let y = -dashLen + (roadDashOffset % (dashLen+gapLen)); y < H; y += dashLen+gapLen) { G.beginPath(); G.moveTo(divX1, y); G.lineTo(divX1, y+dashLen); G.stroke(); }
  let divX2 = ROAD_X + LANE_W * 2; G.strokeStyle = isTwoWay?'#f5c542':'rgba(255,255,255,0.7)'; G.lineWidth = isTwoWay?2.5:3;
  if(isTwoWay){ G.beginPath(); G.moveTo(divX2-3,0); G.lineTo(divX2-3,H); G.stroke(); G.beginPath(); G.moveTo(divX2+3,0); G.lineTo(divX2+3,H); G.stroke(); } else { for (let y = -dashLen + (roadDashOffset % (dashLen+gapLen)); y < H; y += dashLen+gapLen) { G.beginPath(); G.moveTo(divX2, y); G.lineTo(divX2, y+dashLen); G.stroke(); } }
  let divX3 = ROAD_X + LANE_W * 3; G.strokeStyle = 'rgba(255,255,255,0.7)'; G.lineWidth = 3; for (let y = -dashLen + (roadDashOffset % (dashLen+gapLen)); y < H; y += dashLen+gapLen) { G.beginPath(); G.moveTo(divX3, y); G.lineTo(divX3, y+dashLen); G.stroke(); }
}

function drawCar(x,y,w,h,col,facingDown,isP, brk=false, sig=0, isT=false){
  let night = state === 'title' ? 0 : getNightFactor(); 
  G.save(); G.translate(x,y);
  G.fillStyle='rgba(0,0,0,0.4)'; G.beginPath(); G.ellipse(0,h/2+4,w/2,6,0,0,Math.PI*2); G.fill();
  
  if(isT) {
     G.fillStyle = '#ddd'; roundRectPath(G, -w/2, facingDown ? -h/2+25 : -h/2, w, h-25, 2); G.fill(); G.strokeStyle='rgba(0,0,0,0.5)'; G.stroke();
     G.fillStyle = col; roundRectPath(G, -w/2, facingDown ? -h/2 : h/2-25, w, 25, 4); G.fill(); G.stroke();
     G.fillStyle = '#111'; roundRectPath(G, -w/2+2, facingDown ? -h/2+8 : h/2-20, w-4, 12, 2); G.fill();
  } else {
     G.fillStyle=col; roundRectPath(G, -w/2, -h/2, w, h, 6); G.fill(); G.strokeStyle='rgba(0,0,0,0.5)'; G.lineWidth=1.5; G.stroke();
     G.fillStyle='rgba(20,28,40,0.85)'; 
     roundRectPath(G, -w/2+4, facingDown?-h/2+8:h*0.02, w-8, h*0.32, 4); G.fill(); 
     roundRectPath(G, -w/2+5, facingDown?h*0.1:-h/2+6, w-10, h*0.15, 2); G.fill(); 
  }
  
  if (isP) { 
    G.fillStyle='#fff'; G.shadowColor='#fff'; G.shadowBlur=10+(night*15); G.fillRect(-w/2+3, -h/2-2, 6, 4); G.fillRect(w/2-9, -h/2-2, 6, 4); G.shadowBlur=0; 
    G.fillStyle=brakeHeld?'#ff0000':'#880000'; if(brakeHeld||night>0.2) {G.shadowColor='#ff0000'; G.shadowBlur=15;} G.fillRect(-w/2+3, h/2-2, 6, 4); G.fillRect(w/2-9, h/2-2, 6, 4); 
  } 
  else if (facingDown) { G.fillStyle='#fff2b0'; G.shadowColor='#fff2b0'; G.shadowBlur=night>0.2?15:5; G.fillRect(-w/2+3, h/2-2, 6, 4); G.fillRect(w/2-9, h/2-2, 6, 4); G.shadowBlur=0; } 
  else { G.fillStyle=brk?'#ff0000':'#ff3333'; G.shadowColor=brk?'#ff0000':'#ff3333'; G.shadowBlur=(brk||night>0.2)?15:0; G.fillRect(-w/2+3, -h/2-2, 6, 4); G.fillRect(w/2-9, -h/2-2, 6, 4); G.shadowBlur=0; }
  
  if (sig!==0 && Math.floor(tick/15)%2===0) { G.fillStyle='#ffb84d'; G.shadowColor='#ffb84d'; G.shadowBlur=12; G.fillRect(sig===1?w/2-9:-w/2+3, facingDown?h/2-2:-h/2-2, 6, 4); G.shadowBlur=0; }
  G.restore();

  if (night>0.1) {
    G.save(); G.translate(x,y); G.globalAlpha = night;
    let bLen = isP?280:200, sp = isP?70:50, ys = facingDown?h/2:-h/2, ye = facingDown?h/2+bLen:-h/2-bLen;
    let grad = G.createLinearGradient(0, ys, 0, ye); grad.addColorStop(0, 'rgba(255,255,240,0.7)'); grad.addColorStop(1, 'rgba(255,255,240,0)');
    G.fillStyle = grad; G.beginPath(); G.moveTo(-w/2+6, ys); G.lineTo(w/2-6, ys); G.lineTo(w/2+sp, ye); G.lineTo(-w/2-sp, ye); G.closePath(); G.fill(); G.restore();
  }
}

function drawPickups(){ pickups.forEach(p=>{ if(p.collected) return; const bob = Math.sin(Date.now()/220 + p.x)*4; G.save(); G.translate(p.x, p.y+bob); G.shadowColor = '#00e5ff'; G.shadowBlur = 12; G.fillStyle = '#00e5ff'; G.beginPath(); G.arc(0,0,p.r,0,Math.PI*2); G.fill(); G.shadowBlur = 0; G.fillStyle = '#000'; G.font = 'bold 12px Orbitron, monospace'; G.textAlign='center'; G.textBaseline='middle'; G.fillText('N', 0, 1); G.restore(); }); }

function drawWeather() {
  if(weather === 'clear') return;
  if(weather === 'rain' && Math.random()<0.6) envParticles.push({x:Math.random()*W, y:-20, vy: 18+Math.random()*5});
  else if (weather === 'snow' && Math.random()<0.3) envParticles.push({x:Math.random()*W, y:-20, vx:(Math.random()-0.5)*3, vy: 4+Math.random()*3});
  for(let i=envParticles.length-1; i>=0; i--){
    let p=envParticles[i]; p.y+=p.vy; if(p.vx) p.x+=p.vx;
    if(weather==='rain'){ G.fillStyle='rgba(150,200,255,0.5)'; G.fillRect(p.x, p.y, 2, 15); } else { G.fillStyle='rgba(255,255,255,0.8)'; G.beginPath(); G.arc(p.x, p.y, 2, 0, Math.PI*2); G.fill(); }
    if(p.y>H) envParticles.splice(i,1);
  }
}

function drawPlayer(){
  G.save(); if (nosHeld && nitroFuel > 0 && state === 'play') { G.fillStyle = 'rgba(0,229,255,0.7)'; G.beginPath(); G.moveTo(player.x-6, player.y+player.h/2); G.lineTo(player.x+6, player.y+player.h/2); G.lineTo(player.x, player.y+player.h/2+35+Math.random()*15); G.closePath(); G.fill(); } G.restore();
  drawCar(player.x, player.y, player.w, player.h, player.color, false, true, false, 0);
}

function loop(timestamp){
  requestAnimationFrame(loop);
  if (isPaused) return; 
  if (!timestamp) timestamp = performance.now(); let deltaTime = timestamp - lastTime;
  if (deltaTime < frameInterval) return; lastTime = timestamp - (deltaTime % frameInterval);

  tick++; G.clearRect(0,0,W,H);
  if (shakeAmt > 0.3) { shakeX=(Math.random()-0.5)*shakeAmt*2; shakeY=(Math.random()-0.5)*shakeAmt*2; shakeAmt*=0.85; } else { shakeX=0; shakeY=0; shakeAmt=0; }
  G.save(); G.translate(shakeX, shakeY);

  if (state === 'play') {
    updatePhysics(); updatePlayer(); updateTraffic(); updatePickups();
    if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) combo = 1; }
    spawnTimer--; if (spawnTimer <= 0) { spawnTraffic(); let baseDen = 0.30; let addDen = (score / 800) * 0.05; let dubProb = Math.min(baseDen + addDen, 0.80); if(Math.random() < dubProb) spawnTraffic(); spawnTimer = Math.max(15, 60 - currentSpeed*3 + Math.random()*15); }
    pickupTimer--; if (pickupTimer <= 0) { spawnPickup(); pickupTimer = 200 + Math.floor(Math.random()*100); }
    score += (currentSpeed * 0.1); updateHud();
  }

  drawBackground(); drawRoad();
  
  if (state === 'play' || state === 'crash') {
    traffic.forEach(c => drawCar(c.x, c.y, c.w, c.h, c.color, c.oncoming, false, c.aiState === 'braking', c.turnSignal, c.isTruck));
    drawPickups(); drawPlayer(); updateParticles(); drawParticles(); drawWeather(); updatePopups(); drawPopups();
  }

  G.restore();
}

requestAnimationFrame(loop);
</script>
